ESMX:
  App: 
    globalResourceControl: true
    logKindFlag: ESMF_LOGKIND_Multi
    logAppendFlag: false
    logFlush: true
    fieldDictionary: fd_ufs.yaml
    startTime: 2021-07-01T00:00:00
    stopTime: 2021-08-05T00:00:00
  Driver:
    componentList: [MED, ATM, OCN, ICE]
    attributes:
      Verbosity: low 
    runSequence: |
      @3600
         MED med_phases_prep_ocn_avg
         MED -> OCN :remapMethod=redist
         OCN
         @900
           MED med_phases_prep_ice
           MED -> ICE :remapMethod=redist
           ATM
           ICE
           ATM -> MED :remapMethod=redist
           MED med_phases_post_atm
           ICE -> MED :remapMethod=redist
           MED med_phases_post_ice
           MED med_phases_ocnalb_run
           MED med_phases_aofluxes_run
           MED med_phases_prep_ocn_accum
         @
         OCN -> MED :remapMethod=redist
         MED med_phases_post_ocn
         #MED med_phases_restart_write
         #MED med_phases_history_write
      @

attributes: &common
  Verbosity:  low
  ScalarFieldCount: 3
  ScalarFieldIdxGridNX: 1
  ScalarFieldIdxGridNY: 2
  ScalarFieldIdxNextSwCday: 3
  ScalarFieldName: cpl_scalars
  start_type: startup
  read_restart: false
  restart_dir: ./RESTART/
  case_name: dlmom
  write_restart_at_endofrun: .false.
  dbug_flag: 0
  coldair_outbreak_mod: .false.
  flds_wiso: .false.
  flux_convergence: 0.0
  flux_max_iteration: 2
  ocn_surface_flux_scheme: 0
  orb_eccen: 1.e36
  orb_iyear: 2000
  orb_iyear_align: 2000
  orb_mode: fixed_year
  orb_mvelp: 1.e36
  orb_obliq: 1.e36
  restart_n: 999
  restart_option: ndays
  restart_ymd: -999
  stop_n: 35
  stop_option: ndays
  stop_ymd: -999

MED:
  model: cmeps
  petList: 0-47
  attributes:
    Diagnostic: 0
    dbug_flag: 0
    ATM_model: datm
    ICE_model: cice6 
    OCN_model: mom6
    history_n: 1
    history_option: nsteps
    history_ymd: -999
    coupling_mode: ufs.nfrac.aoflux
    mapuv_with_cart3d: false
    pio_typename: netcdf
    pio_numiotasks: -99
    pio_stride: 4
    pio_rearranger: box
    pio_root: -99
    <<: *common

ATM:
  model: datm 
  petList: 0-47
  attributes: 
    Diagnostic: 0
    DumpFields: false
    mesh_atm: Mesh/era5_mesh_cdf5.nc
    diro: "."
    logfile: datm.log
    write_restart_at_endofrun: .true.
    <<: *common

OCN:
  model: mom6 
  petList: 48-511 #40-159
  attributes:
    Diagnostic: 0
    DumpFields: false
    ProfileMemory: false
    OverwriteSlice: true
    mesh_ocn: mesh.mx025.nc
    use_coldstart: false
    use_mommesh: true
    mom6_output_dir: ./MOM6_OUTPUT
    mom6_output_fh: 6
    mom6_restart_dir: ./RESTART/
    <<: *common

ICE:
  model: cice6
  petList: 512-559 #160-207
  attributes:
    Verbosity: 0
    DumpFields: false
    ProfileMemory: false
    OverwriteSlice: true
    mesh_ice: mesh.mx025.nc
    eps_imesh: 1.0e-1
    <<: *common
