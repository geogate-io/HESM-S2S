ESMX:
  App: 
    globalResourceControl: true
    logKindFlag: ESMF_LOGKIND_Multi
    logAppendFlag: false
    logFlush: true
    fieldDictionary: fd_ufs.yaml
    startTime: 2021-10-01T00:00:00
    stopTime: 2021-11-05T00:00:00
  Driver:
    componentList: [MED, ATM, OCN, ICE]
    attributes:
      Verbosity: low 
    runSequence: |
      @3600
         MED med_phases_prep_ocn_avg
         MED -> OCN :remapMethod=redist
         OCN
         @900
           MED med_phases_prep_atm
           OCN -> ATM :remapMethod=redist
           ATM geogate_phases_python
           ATM -> MED :remapMethod=redist
           MED med_phases_post_atm
           MED med_phases_prep_ice
           MED -> ICE :remapMethod=redist
           ICE
           ICE -> MED :remapMethod=redist
           MED med_phases_post_ice
           MED med_phases_ocnalb_run
           MED med_phases_aofluxes_run
           MED med_phases_prep_ocn_accum
         @
         OCN -> MED :remapMethod=redist
         MED med_phases_post_ocn
         #MED med_phases_restart_write
         #MED med_phases_history_write
      @

attributes: &common
  Verbosity:  low
  ScalarFieldCount: 2
  ScalarFieldIdxGridNX: 1
  ScalarFieldIdxGridNY: 2
  ScalarFieldName: cpl_scalars
  start_type: startup
  read_restart: false
  restart_dir: ./RESTART/
  case_name: dlmom
  write_restart_at_endofrun: .false.
  dbug_flag: 0
  coldair_outbreak_mod: .false.
  flds_wiso: .false.
  flux_convergence: 0.0
  flux_max_iteration: 2
  ocn_surface_flux_scheme: 0
  orb_eccen: 1.e36
  orb_iyear: 2000
  orb_iyear_align: 2000
  orb_mode: fixed_year
  orb_mvelp: 1.e36
  orb_obliq: 1.e36
  restart_n: 999 
  restart_option: ndays
  restart_ymd: -999
  stop_n: 35
  stop_option: ndays
  stop_ymd: -999

MED:
  model: cmeps
  petList: 1-48
  attributes:
    Diagnostic: 0
    dbug_flag: 0
    ATM_model: geogate 
    ICE_model: cice6 
    OCN_model: mom6
    history_n: 1
    history_option: nsteps
    history_ymd: -999
    coupling_mode: ufs.nfrac.aoflux
    mapuv_with_cart3d: false
    pio_typename: netcdf
    pio_numiotasks: -99
    pio_stride: 4
    pio_rearranger: box
    pio_root: -99
    <<: *common

ATM:
  model: geogate
  petList: 0
  attributes:
    Diagnostic: 0
    DebugMode: .false.
    KeepFieldList: "So_t:So_omask"
    PythonScripts: data_aurora.py
    ExportMeshFile: Mesh/mesh_aurora_721.nc
    ImportOnExportMesh: .true.
    ExportFields:
      - Sa_z
      - Sa_u10m
      - Sa_v10m
      - Sa_u
      - Sa_v
      - Sa_pslv
      - Sa_pbot
      - Sa_t2m
      - Sa_tbot
      - Sa_q2m
      - Sa_shum
      - Faxa_rain
      - Faxa_lwdn
      - Faxa_swdn
      - Faxa_swvdr
      - Faxa_swndr
      - Faxa_swvdf
      - Faxa_swndf

OCN:
  model: mom6 
  petList: 49-512 #40-159
  attributes:
    Diagnostic: 0
    DumpFields: false
    ProfileMemory: false
    OverwriteSlice: true
    mesh_ocn: mesh.mx025.nc
    use_coldstart: false
    use_mommesh: true
    mom6_output_dir: ./MOM6_OUTPUT
    mom6_output_fh: 6
    mom6_restart_dir: ./RESTART/
    <<: *common

ICE:
  model: cice6
  petList: 513-560 #160-207
  attributes:
    Verbosity: 0
    DumpFields: false
    ProfileMemory: false
    OverwriteSlice: true
    mesh_ice: mesh.mx025.nc
    eps_imesh: 1.0e-1
    <<: *common
